name: test

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pgversion: [18, 17, 16, 15, 14, 13, 12]

    env:
      PGVERSION: ${{ matrix.pgversion }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: '1.26'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1 https://github.com/hashicorp/setup-terraform/releases/tag/v4.0.1
        with:
          terraform_version: '1.15.4'
          terraform_wrapper: false

      - name: test
        run: make test

      - name: vet
        run: make vet

      - name: testacc
        run: make testacc

  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1 https://github.com/hashicorp/setup-terraform/releases/tag/v4.0.1
        with:
          terraform_version: '1.15.4'
          terraform_wrapper: false

      - name: generate
        run: make generate

      - name: git diff
        run: |
          # Intent-to-add plus diffing against HEAD reports new, modified and deleted files alike.
          git add --intent-to-add .
          git diff HEAD --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)
